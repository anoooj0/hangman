<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Hangman</title>
    <script>
        // Configure Tailwind dark mode
        tailwind = {
            darkMode: 'class'
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    <div id="app" class="container mx-auto px-4 py-8">
        <div class="relative mb-8">
            <h1 class="text-4xl font-bold text-center text-gray-800 dark:text-gray-100">
                Multiplayer Hangman
            </h1>
            <!-- Dark mode toggle and admin access -->
            <div class="absolute top-0 right-0 flex items-center space-x-3">
                <!-- Dark mode toggle slider -->
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-600 dark:text-gray-400">☀️</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="darkModeToggle" class="sr-only peer" onchange="game.toggleDarkMode()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                    </label>
                    <span class="text-sm text-gray-600 dark:text-gray-400">🌙</span>
                </div>
                <!-- Discrete admin access button -->
                <button onclick="game.showAdminPanel()" 
                        class="text-xs text-gray-300 hover:text-gray-600 dark:text-gray-400 dark:hover:text-gray-200 transition-colors opacity-30 hover:opacity-100" 
                        title="Admin Access (Ctrl+Shift+A)">
                    ⚙️
                </button>
            </div>
        </div>
        
        <!-- Game container will go here -->
        <div id="gameContainer">
            <!-- Content will be dynamically added -->
        </div>
    </div>

    <script src="scripts/app.js"></script>

    <!-- Vercel Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

<script>
  // Your Firebase config will go here
  const firebaseConfig = {
  apiKey: "AIzaSyCac1xtLupTxmWKzURDy3t-DSPVscLfLOA",
  authDomain: "hangman-multiplayer-6e30f.firebaseapp.com",
  projectId: "hangman-multiplayer-6e30f",
  storageBucket: "hangman-multiplayer-6e30f.appspot.com",
  messagingSenderId: "747779569470",
  appId: "1:747779569470:web:f2e9e4e87c3cb6e51e1e6f",
  measurementId: "G-WDJBZF4HKE"
};
  
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  // Improve compatibility on certain networks/environments (fixes 400 on webchannel)
  if (db && db.settings) {
    try {
      db.settings({ 
        experimentalAutoDetectLongPolling: true,
        experimentalForceLongPolling: true
      });
    } catch (e) {
      console.warn('Failed to apply Firestore settings:', e);
    }
  }
  const auth = firebase.auth();

  console.log('Firebase initialized successfully!');
  console.log('Database:', db);
  console.log('Firebase SDK version:', firebase.SDK_VERSION);
  console.log('App options:', firebase.app().options);

  // Ensure we are authenticated (many rules require an auth context)
  // Use SESSION persistence so each tab gets its own anonymous user (useful for local multiplayer testing)
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
    .then(() => auth.signInAnonymously())
    .then((userCredential) => {
      console.log('Signed in anonymously with UID:', userCredential.user.uid);
      console.log('Authentication state confirmed');
    })
    .catch((err) => {
      console.error('Anonymous sign-in failed:', err);
      console.error('Error code:', err.code);
      console.error('Error message:', err.message);
      
      // Retry authentication after a short delay
      setTimeout(() => {
        console.log('Retrying authentication...');
        auth.signInAnonymously()
          .then((userCredential) => {
            console.log('Retry successful - Signed in with UID:', userCredential.user.uid);
          })
          .catch((retryErr) => {
            console.error('Retry failed:', retryErr);
          });
      }, 2000);
    });
</script>
</body>
</html>
